          </div>
        </div>`;
    }).join('') : note(t('pr.noOrders'));

    $('#profileBody').innerHTML = `
      <div class="flex flex-col items-center text-center">
        <div class="grid h-24 w-24 place-items-center rounded-full bg-gradient-to-br from-aero-200 to-aero-400 text-[36px] font-light text-white shadow-glow dark:from-aero-400 dark:to-aero-600">${escapeHtml(name[0].toUpperCase())}</div>
        <h1 class="mt-5 max-w-full break-words font-semibold tracking-tight ${u ? 'text-[24px]' : 'text-[30px]'}">${escapeHtml(name)}</h1>
        ${u?.is_admin ? `<span class="mt-2 rounded-full bg-ink px-2.5 py-0.5 text-[11px] font-semibold uppercase tracking-wider text-white dark:bg-white dark:text-ink">admin</span>` : ''}
        ${authCard}
        <div class="mt-6 grid w-full grid-cols-2 gap-3">
          <div class="glass rounded-3xl p-5"><div class="text-[32px] font-semibold tracking-tight">${state.tickets.length}</div><div class="text-[13px] text-slate-500 dark:text-slate-400">${t('pr.trips')}</div></div>
          <div class="glass rounded-3xl p-5"><div class="text-[32px] font-semibold tracking-tight">${Object.keys(state.favorites).length}</div><div class="text-[13px] text-slate-500 dark:text-slate-400">${t('pr.saved')}</div></div>
        </div>
      </div>

      ${adminCard}

      <div class="glass mt-8 divide-y divide-black/[.05] overflow-hidden rounded-[24px] dark:divide-white/[.06]">
        ${row(t('pr.currency'), state.currency, 'data-action="cycle-currency"')}
        ${row(t('pr.language'), state.lang === 'ru' ? 'Русский' : 'English', 'data-action="toggle-lang"')}
        ${toggle(t('pr.dark'), state.theme === 'dark', 'toggle-theme')}
        ${toggle(t('pr.notify'), state.notifications, 'toggle-notify')}
      </div>

      <button class="glass group mt-4 flex w-full items-center gap-4 rounded-[24px] p-4 text-left transition-all duration-500 ease-apple hover:-translate-y-0.5 hover:shadow-lift dark:hover:shadow-lift-dark" data-support>
        <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-aero-300 to-aero-500 text-white shadow-glow dark:shadow-none">${SUPPORT_ICON('h-6 w-6')}</span>
        <span class="min-w-0 flex-1">
          <span class="block text-[16px] font-semibold tracking-tight">${t('sup.title')}</span>
          <span class="mt-0.5 flex items-center gap-1.5 text-[13px] text-slate-500 dark:text-slate-400"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>${t('sup.online')}</span>
        </span>
        ${ICON.chevron('h-4 w-4 text-slate-300 transition-transform duration-300 group-hover:translate-x-0.5 dark:text-slate-600')}
      </button>

      ${u ? `
        <h2 class="mb-3 ml-5 mt-8 text-[13px] font-medium uppercase tracking-[.08em] text-slate-400 dark:text-slate-500">${t('pr.orders')}</h2>
        <div class="glass divide-y divide-black/[.05] overflow-hidden rounded-[24px] dark:divide-white/[.06]">${orders}</div>` : ''}

      <div class="glass mt-4 divide-y divide-black/[.05] overflow-hidden rounded-[24px] dark:divide-white/[.06]">
        <div class="list-row"><span>${t('pr.platform')}</span><span class="text-slate-400">${IS_TMA ? t('pr.tma') : t('pr.web')}</span></div>
        <button class="list-row text-rose-500" data-action="reset">${t('pr.reset')}</button>
        ${u ? `<button class="list-row text-rose-500" data-logout><span>${t('acc.logout')}</span>${LOGOUT_ICON('h-[18px] w-[18px]')}</button>` : ''}
      </div>
      <p class="mt-8 text-center text-[12px] text-slate-400 dark:text-slate-600">Aero · prototype v2.0</p>`;
  }

  /* =====================================================================
     12. ШТОРКА БРОНИРОВАНИЯ (Checkout)
     ===================================================================== */
  const findFlight = (id) => [...state.results, ...(state.resultsBack || [])].find((f) => f.id === id) || state.favorites[id];

  /** Карта занятых мест — детерминированная для конкретного рейса */
  function seatMap(f) {
    const rnd = seeded('seats' + f.id);
    const rows = f.cabin === 'business' ? 5 : 12;
    const letters = f.cabin === 'business' ? ['A', 'C', '', 'D', 'F'] : ['A', 'B', 'C', '', 'D', 'E', 'F'];
    const taken = new Set();
    for (let r = 1; r <= rows; r++) letters.forEach((l) => l && rnd() < 0.38 && taken.add(`${r}${l}`));
    return { rows, letters, taken, comfortRows: f.cabin === 'business' ? 0 : 3 };
  }

  const seatFee = (seat, map) => (parseInt(seat, 10) <= map.comfortRows ? SEAT_COMFORT_FEE : 0);

  function sheetTotals() {
    const s = state.sheet;
    const tickets = s.flight.price * s.pax;
    const fees = s.seats.reduce((sum, seat) => sum + seatFee(seat, s.map), 0);
    return { tickets, fees, total: tickets + fees };
  }

  /** Вертикальная временная шкала рейса (с пересадкой, если есть) */
  function timeline(f, leg, from, to, date) {
    const point = (time, code, sub) => `
      <li class="relative pl-7">
        <span class="absolute left-0 top-1.5 h-3 w-3 rounded-full border-2 border-aero-400 bg-white dark:bg-graphite-850"></span>
        <div class="flex items-baseline gap-3"><span class="text-[20px] font-semibold tabular-nums">${hm(time)}</span><span class="text-[15px] font-medium">${cityName(code)}</span><span class="text-[13px] text-slate-400 dark:text-slate-500">${code}</span></div>
        ${sub ? `<div class="text-[13px] text-slate-400 dark:text-slate-500">${sub}</div>` : ''}
      </li>`;
    const gap = (text, warn) => `<li class="relative py-3 pl-7 text-[13px] ${warn ? 'font-medium text-amber-600 dark:text-amber-400' : 'text-slate-400 dark:text-slate-500'}">${text}</li>`;

    let html = point(leg.dep, from, fmtDate(date));
    if (!leg.stops) {
      html += gap(`${t('sheet.inFlight')} · ${dur(leg.duration)}`);
    } else {
      const flying = leg.duration - leg.layover;
      const first = Math.round(flying * 0.45 / 5) * 5;
      html += gap(`${t('sheet.inFlight')} · ${dur(first)}`);
      html += point(leg.dep + first, leg.via);
      html += gap(`${t('sheet.layover')} · ${dur(leg.layover)}`, true);
      html += point(leg.dep + first + leg.layover, leg.via);
      html += gap(`${t('sheet.inFlight')} · ${dur(flying - first)}`);
    }
    html += point(leg.arr, to, leg.dayShift ? `+${leg.dayShift} ${t('day')}` : '');
    return `<ol class="relative before:absolute before:bottom-3 before:left-[5px] before:top-3 before:w-px before:bg-aero-100 dark:before:bg-white/10">${html}</ol>`;
  }

  /**
   * Шторка — это маленький пошаговый мастер:
   * details (рейс, места, пассажир) → payment (способ оплаты) → processing (проверка) → done (билет оформлен).
   * dir — направление анимации при смене шага: 'forward' | 'back'.
   */
  function renderSheet(dir) {
    const s = state.sheet;
    if (s.step === 'payment') return renderPayment(dir);
    if (s.step === 'done') return renderSuccess();
    if (s.step === 'processing') return; // не прерываем анимацию проверки
    renderDetails(dir);
  }

  const stepAnim = (dir) => (dir === 'back' ? 'step-back' : dir === 'forward' ? 'step-in' : '');

  function renderDetails(dir) {
    const s = state.sheet, f = s.flight, al = airlineOf(f);
    const legend = (cls, label) => `<span class="flex items-center gap-1.5"><i class="h-3 w-3 rounded border ${cls}"></i>${label}</span>`;
    $('#sheetBody').innerHTML = `<div class="${stepAnim(dir)}">
      <div class="pt-2">
        <div class="flex items-center gap-3">${logo(al, 'h-11 w-11 text-[14px]')}
          <div><div class="text-[13px] text-slate-400 dark:text-slate-500">${al.name} · ${f.no}</div>
          <h3 class="text-[24px] font-semibold tracking-tight">${cityName(f.from)} ${f.back ? '⇄' : '→'} ${cityName(f.to)}</h3></div>
        </div>
      </div>

      <section class="mt-7">
        <h4 class="mb-4 text-[13px] font-medium uppercase tracking-[.08em] text-slate-400 dark:text-slate-500">${t('sheet.flight')}</h4>
        <div class="surface p-5">${timeline(f, f.out, f.from, f.to, f.date)}</div>
        ${f.back ? `<div class="surface mt-3 p-5">${timeline(f, f.back, f.to, f.from, f.back.date)}</div>` : ''}
      </section>

      <section class="mt-8">
        <div class="mb-4 flex items-end justify-between">
          <h4 class="text-[13px] font-medium uppercase tracking-[.08em] text-slate-400 dark:text-slate-500">${t('sheet.seats')}</h4>
          <span class="text-[13px] text-slate-400 dark:text-slate-500">${t('sheet.seatsHint').replace('{n}', s.pax)}</span>
        </div>
        <div class="mb-4 flex flex-wrap gap-x-4 gap-y-2 text-[12px] text-slate-500 dark:text-slate-400">
          ${legend('seat-free', t('sheet.free'))}
          ${s.map.comfortRows ? legend('seat-comfort', `${t('sheet.comfort')} +${money(SEAT_COMFORT_FEE)}`) : ''}
          ${legend('seat-taken', t('sheet.taken'))}
          ${legend('border-aero-500 bg-aero-500', t('sheet.picked'))}
        </div>
        <!-- «Фюзеляж» -->
        <div class="mx-auto max-w-[340px] rounded-b-[28px] rounded-t-[90px] border border-black/[.05] bg-gradient-to-b from-slate-50 to-white px-5 pb-5 pt-14 dark:border-white/[.06] dark:from-white/[.05] dark:to-white/[.01]">
          <div id="seatGrid"></div>
        </div>
      </section>

      <section class="mt-8">
        <label for="passengerName" class="mb-3 block text-[13px] font-medium uppercase tracking-[.08em] text-slate-400 dark:text-slate-500">${t('sheet.name')}</label>
        <input id="passengerName" class="field-input" autocomplete="name" maxlength="100" placeholder="${t('sheet.namePh')}" value="${escapeHtml(s.name)}" />
      </section>

      <section class="mt-8 space-y-2.5 text-[15px]" id="sheetSummary"></section>

      <button id="buyBtn" class="btn-primary group mt-6">
        <span id="payLabel"></span>${ICON.chevron('h-4 w-4 transition-transform duration-300 group-hover:translate-x-0.5')}
      </button>
      <p class="mt-3 text-center text-[12px] text-slate-400 dark:text-slate-500">${t('sheet.secure')}</p>
    </div>`;
    renderSeats();
    renderSummary();
  }

  function renderSeats() {
    const s = state.sheet, { rows, letters, taken, comfortRows } = s.map;
    const cols = letters.map((l) => (l ? 'minmax(0,1fr)' : '22px')).join(' ');
    let html = `<div class="grid gap-1.5" style="grid-template-columns:${cols}">`;
    html += letters.map((l) => `<div class="pb-1 text-center text-[11px] font-medium text-slate-400 dark:text-slate-500">${l}</div>`).join('');
    for (let r = 1; r <= rows; r++) {
      letters.forEach((l) => {
        if (!l) { html += `<div class="grid place-items-center text-[10px] text-slate-300 dark:text-slate-600">${r}</div>`; return; }
        const id = `${r}${l}`;
        const cls = taken.has(id) ? 'seat-taken' : s.seats.includes(id) ? 'seat-picked' : r <= comfortRows ? 'seat-comfort' : 'seat-free';
        html += `<button class="seat ${cls}" data-seat="${id}" ${taken.has(id) ? 'disabled' : ''} aria-label="${id}">${s.seats.includes(id) ? id : ''}</button>`;
      });
    }
    $('#seatGrid').innerHTML = html + '</div>';
  }

  function renderSummary() {
    const s = state.sheet, { tickets, fees, total } = sheetTotals();
    const line = (a, b, cls = '') => `<div class="flex items-center justify-between ${cls}"><span>${a}</span><span class="tabular-nums">${b}</span></div>`;
    const muted = 'text-slate-500 dark:text-slate-400';
    $('#sheetSummary').innerHTML =
      line(`${t('sheet.tickets')} × ${s.pax}`, money(tickets), muted) +
      line(t('sheet.seatFees'), s.seats.length ? `${s.seats.join(', ')} · ${money(fees)}` : t('sheet.autoSeats'), muted) +
      `<div class="hairline !mt-4 border-t pt-4">${line(t('sheet.total'), money(total), 'text-[22px] font-semibold tracking-tight')}</div>`;
    $('#payLabel').textContent = `${t('sheet.buy')} · ${money(total)}`;
  }

  function openSheet(id) {
    const flight = findFlight(id);
    if (!flight) return;
    // Имя подставляем из Telegram или из прошлого заказа
    const tgUser = IS_TMA ? tg.initDataUnsafe?.user : null;
    const name = store.get('passengerName', '') || (tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') : '');
    state.sheet = {
      flight, seats: [], pax: paxCount(), map: seatMap(flight), name,
      step: 'details',
      method: 'card',                            // выбранный способ оплаты
      card: { number: '', exp: '', cvv: '' },    // живёт только в памяти, на сервер не уходит
      usdt: null,                                // { address, amount, expiresAt }
    };
    renderSheet();
    $('#sheet').scrollTop = 0;
    $('#sheet').classList.add('open');
    $('#backdrop').classList.add('open');
    syncLayers();
    haptic('light');
  }

  function closeSheet() {
    const sheet = $('#sheet');
    sheet.classList.remove('open');
    sheet.style.transform = '';
    $('#backdrop').classList.remove('open');
    stopUsdtTimer();
    state.sheet = null;
    syncLayers();
  }

  /* ---------- Слои поверх страницы: шторка, поддержка, универсальное окно ---------- */
  const anyLayerOpen = () => !!state.sheet || state.support.open || !!state.modal;

  /** Блокировка прокрутки и кнопка «Назад» Telegram — по факту открытых слоёв */
  function syncLayers() {
    document.body.style.overflow = anyLayerOpen() ? 'hidden' : '';
    if (IS_TMA) anyLayerOpen() ? tg.BackButton.show() : tg.BackButton.hide();
  }

  /** Esc и «Назад» в Telegram закрывают самый верхний слой */
  function closeTopLayer() {
    if (state.modal) closeModal();
    else if (state.support.open) closeSupport();
    else if (state.sheet) closeSheet();
  }

  /* =====================================================================
     12.1. ОПЛАТА (имитация): банковская карта / СБП / USDT TRC20
     Реквизиты карты никуда не отправляются — на бэкенд уходит только
     способ оплаты. В демо-режиме деньги не списываются.
     ===================================================================== */
  const PAY_METHODS = ['card', 'sbp', 'usdt'];
  const USDT_TTL = 15 * 60;   // секунд на оплату крипто-счёта
  const BASE58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const PAY_ICON = {
    card: (c) => svg('<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/>', c),
    sbp: (c) => svg('<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2M20 14v.01M14 20h.01M17 17h3v3h-3z"/>', c),
    usdt: (c) => svg('<circle cx="12" cy="12" r="9"/><path d="M8 8.5h8M12 8.5V17M8.3 11.6c1 .5 2.3.8 3.7.8s2.7-.3 3.7-.8"/>', c),
  };
  const chevronLeft = (c) => svg('<path d="m15 6-6 6 6 6"/>', c, 2);
  const copyIcon = (c) => svg('<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/>', c);

  /** Подсветить поле с ошибкой: красная рамка + лёгкое «покачивание» */
  function markInvalid(el, msg) {
    el.classList.add('invalid');
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    el.focus();
    if (msg) toast(msg);
    haptic('error');
  }

  /** Шаг 1 → 2: проверяем имя и переходим к выбору способа оплаты */
  function goToPayment() {
    const s = state.sheet, input = $('#passengerName');
    s.name = input.value.trim();
    if (s.name.length < 2) return markInvalid(input, t('sheet.nameErr'));
    store.set('passengerName', s.name);
    // Билет привязывается к аккаунту — гостя просим войти, после входа продолжим автоматически
    if (API_AVAILABLE && !state.user) return openAuth('login', { reason: 'checkout', after: goToPayment });
    s.step = 'payment';
    renderSheet('forward');
    $('#sheet').scrollTo({ top: 0, behavior: 'smooth' });
    haptic('light');
  }

  function backToDetails() {
    stopUsdtTimer();
    state.sheet.step = 'details';
    renderSheet('back');
    haptic('light');
  }

  const methodBtnClass = (on) =>
    `relative z-[1] flex items-center justify-center gap-2 rounded-xl py-2.5 text-[14px] font-medium transition-colors duration-300 ${
      on ? 'text-ink dark:text-white' : 'text-slate-500 hover:text-ink dark:text-slate-400 dark:hover:text-white'}`;

  /** Экран оплаты: сводка заказа + вкладки способов оплаты */
  function renderPayment(dir) {
    const s = state.sheet, f = s.flight, { total } = sheetTotals();
    $('#sheetBody').innerHTML = `<div class="${stepAnim(dir)}">
      <div class="flex items-center gap-3 pt-1">
        <button data-pay-back aria-label="${t('pay.back')}"
          class="grid h-9 w-9 place-items-center rounded-full bg-black/[.05] text-slate-600 transition hover:bg-black/[.08] dark:bg-white/[.08] dark:text-slate-300 dark:hover:bg-white/[.12]">${chevronLeft('h-4 w-4')}</button>
        <h3 class="text-[24px] font-semibold tracking-tight">${t('pay.title')}</h3>
      </div>

      <div class="surface mt-5 flex items-end justify-between gap-4 p-5">
        <div class="min-w-0">
          <div class="truncate text-[15px] font-medium">${cityName(f.from)} ${f.back ? '⇄' : '→'} ${cityName(f.to)}</div>
          <div class="mt-0.5 truncate text-[13px] text-slate-400 dark:text-slate-500">${fmtDate(f.date)} · ${escapeHtml(s.name)}${s.pax > 1 ? ` +${s.pax - 1}` : ''}</div>
        </div>
        <div class="shrink-0 text-[26px] font-semibold tracking-tight tabular-nums">${money(total)}</div>
      </div>

      <div class="seg-slider mt-6" id="methodSeg" style="--n:${PAY_METHODS.length};--i:${PAY_METHODS.indexOf(s.method)}" role="tablist">
        <span class="thumb"></span>
        ${PAY_METHODS.map((m) => `<button class="${methodBtnClass(m === s.method)}" data-method="${m}" role="tab">${PAY_ICON[m]('h-[18px] w-[18px]')}${t('pay.' + m)}</button>`).join('')}
      </div>

      <div id="methodPanel" class="mt-6"></div>

      <p class="mt-4 flex items-center justify-center gap-1.5 text-center text-[12px] text-slate-400 dark:text-slate-500">${ICON.lock('h-3.5 w-3.5')}${t('pay.demo')}</p>
    </div>`;
    renderMethodPanel();
  }

  /** Переключение вкладки: двигаем «подложку» и меняем панель без перерисовки всего экрана */
  function selectMethod(m) {
    const s = state.sheet;
    if (!s || s.method === m) return;
    s.method = m;
    const seg = $('#methodSeg');
    seg.style.setProperty('--i', PAY_METHODS.indexOf(m));
    $$('[data-method]', seg).forEach((b) => (b.className = methodBtnClass(b.dataset.method === m)));
    renderMethodPanel();
    haptic('select');
  }

  function renderMethodPanel() {
    const s = state.sheet, panel = $('#methodPanel');
    if (!panel) return;
    stopUsdtTimer();
    const { total } = sheetTotals();
    if (s.method === 'card') panel.innerHTML = cardPanel(total);
    if (s.method === 'sbp') panel.innerHTML = sbpPanel(total);
    if (s.method === 'usdt') {
      if (!s.usdt || s.usdt.expiresAt <= Date.now()) s.usdt = newUsdtInvoice(total);
      panel.innerHTML = usdtPanel();
      startUsdtTimer();
    }
    panel.firstElementChild.classList.add('panel-in');
    if (s.method === 'card') updateCardPreview();
  }

  /* ---------- Банковская карта ---------- */
  function cardPanel(total) {
    const c = state.sheet.card;
    return `
      <div>
        <div class="card-preview mx-auto w-full max-w-[340px] p-5" id="cardPreview">
          <div class="relative flex h-full flex-col justify-between">
            <div class="flex items-start justify-between">
              <span class="card-chip"></span>
              <span class="text-[15px] font-semibold italic tracking-tight opacity-95" id="cpBrand"></span>

  /** Платёжная система по первым цифрам: МИР 2200–2204, Visa 4…, Mastercard 51–55 / 2221–2720 */
  function cardBrand(digits) {
    if (/^220[0-4]/.test(digits)) return 'МИР';
    if (/^4/.test(digits)) return 'VISA';
    if (/^(5[1-5]|2[2-7])/.test(digits)) return 'Mastercard';
    return '';
  }

  /** Алгоритм Луна — контрольная сумма номера карты */
  function luhn(digits) {
    let sum = 0;
    [...digits].reverse().forEach((d, i) => {
      let n = Number(d);
      if (i % 2) { n *= 2; if (n > 9) n -= 9; }
      sum += n;
    });
    return sum % 10 === 0;
  }

  /** Живое превью карты: номер подставляется поверх «точек» */
  function updateCardPreview() {
    const c = state.sheet.card, digits = c.number.replace(/\D/g, '');
    const masked = (digits + '•'.repeat(16 - digits.length)).replace(/(.{4})/g, '$1 ').trim();
    $('#cpNumber').textContent = masked;
    $('#cpExp').textContent = c.exp || t('pay.expPh');
    $('#cpBrand').textContent = cardBrand(digits);
  }

  /** Маски ввода: «0000 0000 0000 0000», «ММ/ГГ», CVV из 3 цифр + автопереход между полями */
  function onCardInput(el) {
    const c = state.sheet.card;
    if (el.id === 'ccNumber') {
      el.value = el.value.replace(/\D/g, '').slice(0, 16).replace(/(.{4})/g, '$1 ').trim();
      c.number = el.value;
      if (c.number.length === 19) $('#ccExp').focus();
    }
    if (el.id === 'ccExp') {
      let d = el.value.replace(/\D/g, '').slice(0, 4);
      if (d.length >= 3) d = d.slice(0, 2) + '/' + d.slice(2);
      el.value = d;
      c.exp = d;
      if (d.length === 5) $('#ccCvv').focus();
    }
    if (el.id === 'ccCvv') {
      el.value = el.value.replace(/\D/g, '').slice(0, 3);
      c.cvv = el.value;
    }
    el.classList.remove('invalid');
    updateCardPreview();
  }

  /** Проверка реквизитов; возвращает первое поле с ошибкой */
  function validateCard() {
    const c = state.sheet.card, digits = c.number.replace(/\D/g, '');
    if (digits.length !== 16 || !luhn(digits)) return { el: $('#ccNumber'), msg: t('pay.errNumber') };
    const [mm, yy] = c.exp.split('/').map(Number);
    const endOfMonth = new Date(2000 + yy, mm, 0, 23, 59, 59);   // последний день месяца
    if (!(mm >= 1 && mm <= 12) || !yy || endOfMonth < new Date()) return { el: $('#ccExp'), msg: t('pay.errExpiry') };
    if (c.cvv.length !== 3) return { el: $('#ccCvv'), msg: t('pay.errCvv') };
    return null;
  }

  /* ---------- СБП ---------- */
  /**
   * Имитация QR-кода: три «глазка» по углам + псевдослучайные модули.
   * Для настоящей оплаты сюда подставляется QR из ответа банка-эквайера.
   */
  function fakeQR(seed, n = 29) {
    const rnd = seeded(seed);
    const finder = (fx, fy, i, j) => {
      const dx = i - fx, dy = j - fy;
      if (dx < -1 || dy < -1 || dx > 7 || dy > 7) return null;                 // вне зоны «глазка»
      if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return false;                  // белая рамка вокруг
      return dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
    };
    let d = '';
    for (let j = 0; j < n; j++) {
      for (let i = 0; i < n; i++) {
        let v = finder(0, 0, i, j) ?? finder(n - 7, 0, i, j) ?? finder(0, n - 7, i, j);
        if (v === null) v = rnd() < 0.5;
        if (v) d += `M${i} ${j}h1v1h-1z`;
      }
    }
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" class="h-full w-full" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#1D1D1F"/></svg>`;
  }

  /* ---------- USDT (TRC20) ---------- */
  /** Тестовый TRON-адрес: «T» + 33 символа Base58. Только для демонстрации! */
  function testTronAddress() {
    const bytes = crypto.getRandomValues(new Uint8Array(33));
    return 'T' + [...bytes].map((b) => BASE58[b % 58]).join('');
  }

  /** Счёт: сумма в USDT с уникальными центами — так шлюзы сопоставляют входящий перевод с заказом */

    const amount = (Math.ceil(totalRub * RATES.USD) + (1 + Math.floor(Math.random() * 98)) / 100).toFixed(2);

  /* ---------- Проверка платежа → бэкенд → билет ---------- */
  async function processPayment() {
    const s = state.sheet;
    if (!s || s.step !== 'payment') return;
    if (s.method === 'card') {
      const bad = validateCard();
      if (bad) return markInvalid(bad.el, bad.msg);
    }
    stopUsdtTimer();
    s.step = 'processing';
    haptic('medium');

    const f = s.flight, { total } = sheetTotals();
    const steps = [t('pay.check1'), t('pay.check2.' + s.method), t('pay.check3')];
    $('#sheetBody').innerHTML = `
      <div class="step-in flex min-h-[440px] flex-col items-center justify-center py-12 text-center">
        <div class="relative h-24 w-24">
          <span class="ring-pulse absolute inset-0 rounded-full bg-aero-300/40 dark:bg-aero-400/20"></span>
          <svg class="ring-spin absolute inset-0 h-full w-full" viewBox="0 0 96 96">
            <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3CDFF"/><stop offset="1" stop-color="#4596F7"/></linearGradient></defs>
            <circle cx="48" cy="48" r="42" fill="none" class="text-aero-100 dark:text-white/10" stroke="currentColor" stroke-width="5"/>
            <circle cx="48" cy="48" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="80 184"/>
          </svg>
          <span class="absolute inset-0 grid place-items-center text-aero-500 dark:text-aero-300">${PAY_ICON[s.method]('h-8 w-8')}</span>
        </div>
        <p class="mt-9 text-[20px] font-semibold tracking-tight" id="checkText">${steps[0]}</p>
        <p class="mt-1.5 text-[14px] text-slate-400 dark:text-slate-500">${money(total)} · ${t('pay.method.' + s.method)}</p>
        <div class="mt-7 flex gap-1.5" id="checkDots">${steps.map(() => '<span class="h-1.5 w-7 rounded-full bg-black/[.08] transition-colors duration-500 dark:bg-white/10"></span>').join('')}</div>
      </div>`;

    const setStep = (i) => {
      const el = $('#checkText');
      if (!el || state.sheet !== s) return;
      el.textContent = steps[i];
      el.classList.remove('text-swap'); void el.offsetWidth; el.classList.add('text-swap');
      $$('#checkDots span').forEach((dot, j) => dot.classList.toggle('!bg-aero-500', j <= i));
    };
    setStep(0);
    await sleep(1200); setStep(1);
    await sleep(1400); setStep(2);

    // Платёж «подтверждён» — сохраняем заказ в SQLite через FastAPI
    const [result] = await Promise.allSettled([
      // Рейс из расписания: цену, маршрут и дату сервер возьмёт из базы, места спишет сам.
      // Рейс без dbId (старое избранное) с сервером купить нельзя — он не из расписания.
      !API_AVAILABLE ? Promise.reject(Object.assign(new Error('offline'), { status: 0 }))
        : !f.dbId ? Promise.reject(Object.assign(new Error(t('res.gone')), { status: 404 }))
        : api.book({
          flight_id: f.dbId,
          passenger_name: s.name,
          pax: s.pax,
          seats: s.seats,
          cabin: f.cabin,
          payment_method: s.method,
          // Снимок рейса — чтобы «Мои билеты» показывали посадочный талон с любого устройства
          details: { flight: f, seats: s.seats, pax: s.pax },
        }),
      sleep(800),
    ]);

    // Сессия истекла, пока шла оплата: возвращаемся к выбору способа и просим войти снова
    if (result.status === 'rejected' && result.reason?.status === 401) {
      sessionExpired();
      s.step = 'payment';
      if (state.sheet === s) renderSheet('back');
      openAuth('login', { reason: 'checkout' });
      return;
    }
    // Мест не осталось / рейс вылетел или убран из расписания — объясняем и возвращаем к деталям
    if (result.status === 'rejected' && [404, 409, 422].includes(result.reason?.status)) {
      toast(result.reason.message);
      haptic('error');
      s.step = 'details';
      if (state.sheet === s) renderSheet('back');
      return;
    }

    const booking = result.status === 'fulfilled' ? result.value.booking : null;
    let pnr, paid = total;
    if (booking) {
      pnr = booking.pnr;
      paid = booking.price;                                      // итог посчитал сервер
      state.tickets.unshift(bookingToTicket(booking));          // новые — первыми, как отдаёт сервер
      f.seatsLeft = Math.max(0, (f.seatsLeft ?? s.pax) - s.pax);
    } else {
      // Офлайн-демо (страница открыта как файл) или сервер недоступен — сохраняем на устройстве
      toast(t('toast.offline'));
      pnr = Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
      state.tickets.unshift({ pnr, orderId: null, status: 'Оплачено', method: s.method, name: s.name, flight: f, seats: s.seats.slice(), pax: s.pax, total });
      if (!API_AVAILABLE) store.set('tickets', state.tickets);
    }
    s.card = { number: '', exp: '', cvv: '' };   // реквизиты больше не нужны — стираем
    s.result = { pnr, orderId: booking?.id ?? null, total: paid };
    s.step = 'done';
    haptic('success');
    if (state.sheet === s) renderSuccess();   // пользователь мог закрыть шторку — билет всё равно сохранён
  }

  async function submitSupport(e) {
    e.preventDefault();
    const s = state.support;
    if (s.sending) return;
    s.name = $('#supName').value.trim();
    s.contact = $('#supContact').value.trim();
    s.message = $('#supMessage').value.trim();
    s.pnr = $('#supPnr')?.value || '';
    if (s.name.length < 2) return markInvalid($('#supName'), t('sup.errName'));
    if (!isValidContact(s.contact)) return markInvalid($('#supContact'), t('sup.errContact'));
    if (s.message.length < 10) return markInvalid($('#supMessage'), t('sup.errMessage'));

    s.sending = true;
    const btn = $('#supSubmit');
    btn.disabled = true;
    btn.innerHTML = `<svg class="h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="2.5"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>${t('sup.sending')}`;

    // Отправка на сервер; без сервера — имитация с локальным номером обращения
    const [res] = await Promise.allSettled([
      api.support({ name: s.name, contact: s.contact, topic: s.topic, message: s.message, booking_pnr: s.pnr || null }),
      sleep(900),
    ]);
    const ticket = res.status === 'fulfilled' ? res.value.ticket_number : `SUP-${String(Date.now()).slice(-6)}`;

    store.set('supportContact', s.contact);
    s.result = { ticket, topic: s.topic, contact: s.contact };
    s.message = '';
    s.sending = false;
    s.view = 'sent';
    haptic('success');
    toast(t('sup.toast'));
    if (s.open) renderSupport();
  }

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  /** Те же правила, что на сервере: от 8 символов, буквы и цифры */
  const passwordOk = (p) => p.length >= 8 && /[A-Za-zА-Яа-яЁё]/.test(p) && /\d/.test(p);
  /** Надёжность пароля 0–4 для индикатора */
  function passwordScore(p) {
    let score = 0;
    if (p.length >= 8) score++;
    if (/[A-Za-zА-Яа-яЁё]/.test(p) && /\d/.test(p)) score++;
    if (/[A-ZА-ЯЁ]/.test(p) && /[a-zа-яё]/.test(p)) score++;
    if (p.length >= 12 || /[^A-Za-zА-Яа-яЁё0-9]/.test(p)) score++;
    return score;
  }

  /**
   * Аэропорты из базы → списки «Откуда / Куда». Без сервера остаётся встроенный список.
   * Если выбранного города больше нет (удалён в админке) — подставляем первый доступный.
   */
  async function loadAirports() {
    if (!API_AVAILABLE) return;
    let list;
    try { list = await api.airports(); } catch (e) { return; }
    if (!list.length) return;
    CITIES = list.map((ap) => ({
      id: ap.id, code: ap.code, name: ap.name,
      ru: ap.city, en: ap.city_en || ap.city,
      country: { ru: ap.country, en: ap.country_en || ap.country },
    }));
    if (!city(state.from)) state.from = CITIES[0].code;
    if (!city(state.to) || state.to === state.from) state.to = (CITIES.find((c) => c.code !== state.from) || CITIES[0]).code;
    renderSearchPanel();
    $$('.popover.open[data-side]').forEach((pop) => renderCityList(pop, $('.pop-search', pop).value));
  }

  /** Первичная проверка сессии и «маршрутизация» /admin */
  async function initAuth() {
    if (API_AVAILABLE) {
      try { state.user = (await api.me()).user; } catch (e) { state.user = null; }
    }
    state.authReady = true;
    renderAccount();
    await loadTickets();
    if (state.tab === 'profile') renderProfile();
    if (state.tab === 'tickets') renderTickets();

    const wantsAdmin = location.pathname === '/admin' || new URLSearchParams(location.search).get('next') === 'admin';
    if (!wantsAdmin) return;
    if (state.user?.is_admin) return go('admin');
    history.replaceState(null, '', '/');
    if (!state.user) {
      openAuth('login', { reason: 'admin', after: () => (state.user?.is_admin ? go('admin') : toast(t('adm.denied'))) });
    }
  }

          <input id="authEmail" class="field-input" type="email" inputmode="email" autocomplete="${reg ? 'email' : 'username'}" maxlength="254" placeholder="you@example.com" value="${escapeHtml(m.email)}" />
        </div>
        <div>
          <label class="field-label" for="authPassword">${t('auth.password')}</label>
          <div class="relative">
            <input id="authPassword" class="field-input pr-12" type="${type}" autocomplete="${reg ? 'new-password' : 'current-password'}" maxlength="128" placeholder="${reg ? t('auth.rule') : '••••••••'}" value="${escapeHtml(m.password)}" />
            <button type="button" data-auth-show aria-label="${t('auth.show')}"
              class="absolute right-1.5 top-1/2 grid h-9 w-9 -translate-y-1/2 place-items-center rounded-xl text-slate-400 transition hover:bg-black/[.04] hover:text-ink dark:hover:bg-white/[.06] dark:hover:text-white">${(m.show ? EYE_OFF_ICON : EYE_ICON)('h-[18px] w-[18px]')}</button>
          </div>
          ${reg ? '<div class="strength mt-2 grid grid-cols-4 gap-1" id="authStrength"><span></span><span></span><span></span><span></span></div>' : ''}
        </div>
        ${reg ? `
          <div>
            <label class="field-label" for="authPassword2">${t('auth.password2')}</label>
            <input id="authPassword2" class="field-input" type="${type}" autocomplete="new-password" maxlength="128" value="${escapeHtml(m.password2)}" />
          </div>` : ''}
        <div id="authError" class="${m.error ? '' : 'hidden'} rounded-2xl bg-rose-50 px-4 py-3 text-[13px] font-medium text-rose-600 dark:bg-rose-400/10 dark:text-rose-300">${escapeHtml(m.error)}</div>
        ${API_AVAILABLE ? '' : `<div class="rounded-2xl bg-amber-50 px-4 py-3 text-[13px] text-amber-700 dark:bg-amber-400/10 dark:text-amber-300">${t('auth.offline')}</div>`}
        <button type="submit" id="authSubmit" class="btn-primary !mt-5 disabled:opacity-40" ${API_AVAILABLE ? '' : 'disabled'}>${t(reg ? 'auth.registerBtn' : 'auth.loginBtn')}</button>
        <p class="pt-1 text-center text-[13px] text-slate-500 dark:text-slate-400">
          ${t(reg ? 'auth.haveAccount' : 'auth.noAccount')}
          <button type="button" class="font-medium text-aero-600 hover:underline dark:text-aero-300" data-auth-mode="${reg ? 'login' : 'register'}">${t(reg ? 'auth.login' : 'auth.register')}</button>
        </p>
      </div>`;
    updateStrength();
  }

  /** Индикатор надёжности пароля — обновляется на лету, без перерисовки формы */
  function updateStrength() {
    const bar = $('#authStrength');
    if (!bar) return;
    const score = passwordScore(state.modal.password);
    const colors = ['bg-rose-400', 'bg-amber-400', 'bg-aero-400', 'bg-emerald-500'];
    $$('span', bar).forEach((seg, i) => (seg.className = `h-1 rounded-full ${i < score ? colors[score - 1] : 'bg-black/[.06] dark:bg-white/10'}`));
  }

  /** Сохранить введённое перед перерисовкой формы */
  function captureAuthFields() {
    const m = state.modal;
    m.email = $('#authEmail')?.value.trim() ?? m.email;
    m.password = $('#authPassword')?.value ?? m.password;
    m.password2 = $('#authPassword2')?.value ?? m.password2;
  }

  function switchAuthMode(mode) {
    const m = state.modal;
    if (m.mode === mode) return;
    captureAuthFields();
    m.mode = mode;
    m.error = '';
    const seg = $('#authSeg');
    seg.style.setProperty('--i', mode === 'register' ? 1 : 0);
    $$('[data-auth-mode]', seg).forEach((b) => (b.className = methodBtnClass(b.dataset.authMode === mode)));
    renderAuthTexts();
    renderAuthForm();
    haptic('select');
  }

  function showAuthError(message, field) {
    const m = state.modal, box = $('#authError');
    m.error = message;
    box.textContent = message;
    box.classList.remove('hidden');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    if (field) markInvalid($(field));
    else haptic('error');
  }

  async function submitAuth(e) {
    e.preventDefault();
    const m = state.modal;
    if (!m || m.busy) return;
    captureAuthFields();
    const reg = m.mode === 'register';
    m.email = m.email.toLowerCase();
    if (!EMAIL_RE.test(m.email)) return showAuthError(t('auth.errEmail'), '#authEmail');
    if (!m.password) return showAuthError(t('auth.errPassword'), '#authPassword');
    if (reg && !passwordOk(m.password)) return showAuthError(t('auth.errRule'), '#authPassword');
    if (reg && m.password !== m.password2) return showAuthError(t('auth.errMatch'), '#authPassword2');

    m.busy = true;
    const btn = $('#authSubmit');
    btn.disabled = true;
    btn.innerHTML = spinner;
    try {
      const { user } = await api[reg ? 'register' : 'login']({ email: m.email, password: m.password });
      store.set('lastEmail', m.email);
      const after = m.after;
      closeModal();
      await setUser(user);
      toast(t(reg ? 'auth.welcomeNew' : 'auth.welcome'));
      haptic('success');
      if (after) after();
    } catch (err) {
      m.busy = false;
      btn.disabled = false;
      btn.textContent = t(reg ? 'auth.registerBtn' : 'auth.loginBtn');
      const known = { 0: 'auth.offline', 401: 'auth.errCreds', 409: 'auth.errExists' }[err.status];
      showAuthError(known ? t(known) : err.status === 422 ? err.message : t('auth.errGeneric'));
    }
  }

  /* =====================================================================
     12.4. АДМИН-ПАНЕЛЬ: все заказы, смена статуса, правка, удаление
     Права проверяет сервер (/api/admin/* → 403 для обычных пользователей).
     ===================================================================== */
  /** Чистое состояние админки (при входе/выходе другого пользователя) */
  const freshAdminState = () => ({
    section: 'orders', loading: false,
    rows: [], stats: null, query: '', filter: 'all', loaded: false,                       // заказы
    flights: [], flightsLoaded: false, flightQuery: '', flightScope: 'upcoming', flightLimit: 50,   // расписание
    airports: [], airportsLoaded: false,                                                  // направления
  });
  const ADMIN_SECTIONS = ['orders', 'flights', 'airports'];

  /** Загрузить данные текущего раздела админки */
  async function loadAdmin() {
    const a = state.admin, section = a.section;
    if (a.loading) return;
    a.loading = true;
    $('[data-admin-refresh] svg')?.classList.add('animate-spin');
    try {
      if (section === 'orders') {
        const [rows, stats] = await Promise.all([api.admin.bookings(), api.admin.stats()]);
        Object.assign(a, { rows, stats, loaded: true });
      } else {
        // Для формы рейса нужны аэропорты, для списка аэропортов — число рейсов
        const [flights, airports] = await Promise.all([api.admin.flights(), api.admin.airports()]);
        Object.assign(a, { flights, flightsLoaded: true, airports, airportsLoaded: true });
      }
    } catch (e) {
      a.loading = false;
      if (e.status === 401) return sessionExpired();
      if (e.status === 403) { toast(t('adm.denied')); return go('profile'); }
      toast(t('adm.loadError'));
    }
    a.loading = false;
    $('[data-admin-refresh] svg')?.classList.remove('animate-spin');
    if (state.tab === 'admin' && a.section === section) renderAdminSection();
  }

  async function refreshAdminStats() {
    try { state.admin.stats = await api.admin.stats(); renderAdminStats(); } catch (e) {}
  }

  /** Оболочка админки: заголовок + переключатель разделов (подложка скользит) */

    const a = state.admin;
    const icons = { orders: ICON.ticket, flights: (c) => ICON.plane(c), airports: (c) => svg('<path d="M12 21s-6.5-5.4-6.5-11a6.5 6.5 0 0 1 13 0c0 5.6-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/>', c) };
    $('#adminBody').innerHTML = `
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="mb-2 flex items-center gap-2 text-[13px] font-medium uppercase tracking-[.2em] text-aero-600 dark:text-aero-300">${SHIELD_ICON('h-4 w-4')}Aero Admin</p>
          <h1 class="text-[40px] font-semibold leading-tight tracking-[-0.03em]">${t('adm.title')}</h1>
          <p class="mt-1 text-[17px] font-light text-slate-500 dark:text-slate-400">${t('adm.sub')}</p>

        ${ADMIN_SECTIONS.map((s) => `<button class="${methodBtnClass(s === a.section)} !text-[13px] sm:!text-[14px]" data-admin-section="${s}"><span class="h-4 w-4">${icons[s]('h-4 w-4')}</span>${t('adm.sec.' + s)}</button>`).join('')}
      </div>

      <div id="adminSection" class="mt-6"></div>`;
    renderAdminSection();
  }

  function selectAdminSection(section) {
    const a = state.admin;
    if (a.section === section) return;
    a.section = section;
    const seg = $('#adminSectionSeg');
    seg.style.setProperty('--i', ADMIN_SECTIONS.indexOf(section));
    $$('[data-admin-section]', seg).forEach((b) => (b.className = `${methodBtnClass(b.dataset.adminSection === section)} !text-[13px] sm:!text-[14px]`));

    const box = $('#adminSection');

  function renderAdminStats() {
    const box = $('#adminStats'), s = state.admin.stats;
    if (!box) return;
    const card = (label, value, icon, accent) => `
      <div class="glass rounded-3xl p-5">

        card(t('adm.stat.revenue'), money(s.revenue), PAY_ICON.card('h-5 w-5'), 'text-emerald-500') +
        card(t('adm.stat.users'), s.users, ICON.person('h-5 w-5'), 'text-indigo-400') +

  /** Поиск по #, PNR, пассажиру, e-mail и маршруту + фильтр по статусу */
  function adminVisibleRows() {
    const { rows, query, filter } = state.admin, q = query.trim().toLowerCase();
    return rows.filter((b) =>
      (filter === 'all' || b.status === filter) &&
      (!q || [String(b.id), b.pnr, b.passenger_name, b.user_email, b.route].some((v) => v && v.toLowerCase().includes(q))));
  }

    const td = 'px-4 py-3.5';

      ? `<span class="inline-flex items-center gap-1.5 text-slate-500 dark:text-slate-400">${PAY_ICON[b.payment_method]('h-4 w-4')}${t('pay.' + b.payment_method)}</span>` : '—';
    return `

        <td class="${td}">
          <div class="font-medium">${escapeHtml(b.passenger_name)}</div>

        <td class="${td} max-w-[240px] truncate" title="${escapeHtml(b.route)}">${escapeHtml(b.route)}</td>
        <td class="${td} whitespace-nowrap tabular-nums">${fmtDate(b.flight_date, { day: 'numeric', month: 'short', year: 'numeric' })}</td>

        <td class="${td} whitespace-nowrap text-right">

  function renderAdminRows() {
    const a = state.admin, tbody = $('#adminRows');
    if (!tbody) return;
    $$('[data-count]').forEach((el) => {
      const f = el.dataset.count;
      el.textContent = a.loaded ? ' ' + (f === 'all' ? a.rows.length : a.rows.filter((b) => b.status === f).length) : '';
    });
    if (!a.loaded) {
      tbody.innerHTML = Array.from({ length: 4 }, () => `<tr class="border-t border-black/[.05] dark:border-white/[.06]">${'<td class="px-4 py-4"><div class="skeleton h-3 w-full"></div></td>'.repeat(9)}</tr>`).join('');
      return;
    }
    const list = adminVisibleRows();
    const empty = $('#adminEmpty');
    empty.classList.toggle('hidden', list.length > 0);
    empty.textContent = a.rows.length ? t('adm.noMatch') : t('adm.empty');
    tbody.innerHTML = list.map(adminRow).join('');
  }

  /** Короткая голубая подсветка строки после изменения */
  function flashRow(id) {
    const tr = $(`[data-row="${id}"]`);
    if (!tr) return;
    tr.classList.remove('row-flash'); void tr.offsetWidth; tr.classList.add('row-flash');
  }

  /** Быстрая смена статуса прямо в таблице (оптимистично, с откатом при ошибке) */
  async function changeStatus(id, status, select) {
    const row = state.admin.rows.find((b) => b.id === id);
    if (!row || row.status === status) return;
    const prev = row.status;
    const paint = (s) => { select.value = s; select.className = `status-select status-${STATUS_KEY[s]}`; };
    row.status = status;
    paint(status);
    try {
      Object.assign(row, await api.admin.update(id, { status }));
      flashRow(id);
      renderAdminRows();
      refreshAdminStats();
      toast(t('adm.saved'));
      haptic('success');
    } catch (e) {
      row.status = prev;
      paint(prev);
      if (e.status === 401) return sessionExpired();
      toast(e.message || t('adm.saveError'));
    }
  }

  /* ---------- Универсальное подтверждение удаления ---------- */

      <div class="flex flex-col items-center pt-2 text-center sm:pt-0">

      await m.onConfirm();

    state.admin.airports.forEach((ap) => { if (codes.includes(ap.code)) ap.flights_count += delta; });

  /* ---------- Раздел «Рейсы» (расписание) ---------- */
  function renderFlightsSection(box) {
    const a = state.admin;
    const [first, second] = a.airports;

  async function submitFlight(e) {
    e.preventDefault();
    const btn = $('#flightSubmit'), label = btn.innerHTML;
    if (btn.disabled) return;
    $('#flightError').classList.add('hidden');
    const v = {
      flight_number: $('#flNumber').value.trim().toUpperCase(),
      origin_code: $('#flFrom').value,
      destination_code: $('#flTo').value,
      departure_time: $('#flDep').value,
      duration_minutes: Number($('#flHours').value) * 60 + Number($('#flMinutes').value),
      price: Number($('#flPrice').value),
      seats_available: Number($('#flSeats').value),
      baggage: $('#flBaggage').classList.contains('on'),
    };
    if (!/^[A-Z0-9]{2}\s?\d{1,4}$/.test(v.flight_number)) return formError('flightError', t('adm.fl.errNumber'), '#flNumber');
    if (!v.origin_code || v.origin_code === v.destination_code) return formError('flightError', t('adm.fl.errRoute'), '#flTo');
    if (!v.departure_time || v.departure_time <= nowLocalISO()) return formError('flightError', t('adm.fl.errDate'), '#flDep');
    if (!(v.duration_minutes >= 20 && v.duration_minutes <= 1440)) return formError('flightError', t('adm.fl.errDuration'), '#flHours');
    if (!(v.price > 0)) return formError('flightError', t('adm.errPrice'), '#flPrice');
    if (!Number.isInteger(v.seats_available) || v.seats_available < 0) return formError('flightError', t('adm.fl.errSeats'), '#flSeats');

    setBusy(btn, true);
    try {
      const flight = await api.admin.addFlight(v);
      const a = state.admin;
      a.flights.push(flight);
      a.flights.sort((x, y) => x.departure_time.localeCompare(y.departure_time));
      bumpAirportFlights([flight.origin_code, flight.destination_code], 1);
      // Показать новый рейс: сбросить поиск и раскрыть список до него
      a.flightQuery = '';
      $('#flightSearch').value = '';
      a.flightLimit = Math.max(a.flightLimit, adminFlightRows().findIndex((f) => f.id === flight.id) + 1);
      renderFlightRows();
      const row = $(`[data-flight-row="${flight.id}"]`);
      row?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row?.classList.add('row-flash');
      $('#flNumber').value = '';
      $('#flPrice').value = '';
      toast(t('adm.fl.added').replace('{no}', flight.flight_number));
      haptic('success');
    } catch (err) {
      if (err.status === 401) return sessionExpired();
      formError('flightError', err.message || t('adm.saveError'));
    } finally {
      setBusy(btn, false, label);
    }
  }

  function askDeleteFlight(id) {
    const f = state.admin.flights.find((x) => x.id === id);
    if (!f) return;
    const [day, time] = f.departure_time.split('T');
    openAsk({
      title: t('adm.fl.delTitle').replace('{no}', escapeHtml(f.flight_number)),

  }

  async function submitAirport(e) {
    e.preventDefault();
    const btn = $('#airportSubmit'), label = btn.innerHTML;
    if (btn.disabled) return;
    $('#airportError').classList.add('hidden');
    const v = {
      country: $('#apCountry').value.trim(),
      city: $('#apCity').value.trim(),
      code: $('#apCode').value.trim().toUpperCase(),
      name: $('#apName').value.trim(),
      country_en: $('#apCountryEn').value.trim() || null,
      city_en: $('#apCityEn').value.trim() || null,
    };
    if (v.country.length < 2) return formError('airportError', t('adm.ap.errCountry'), '#apCountry');
    if (!v.city) return formError('airportError', t('adm.ap.errCity'), '#apCity');
    if (!/^[A-Z]{3}$/.test(v.code)) return formError('airportError', t('adm.ap.errCode'), '#apCode');
    if (v.name.length < 2) return formError('airportError', t('adm.ap.errName'), '#apName');
    if (Object.values(v).some((x) => x && UNSAFE_TEXT.test(x))) return formError('airportError', t('adm.ap.errChars'));

    setBusy(btn, true);
    try {
      const airport = await api.admin.addAirport(v);
      const a = state.admin;
      a.airports.push(airport);
      a.airports.sort((x, y) => x.country.localeCompare(y.country) || x.city.localeCompare(y.city));
      a.airportQuery = '';
      $('#airportSearch').value = '';
      renderAirportList();
      const row = $(`[data-airport-row="${airport.id}"]`);
      row?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row?.classList.add('row-flash');
      $('#airportForm').reset();
      loadAirports();   // новый город сразу появится в полях «Откуда / Куда»
      toast(t('adm.ap.added').replace('{code}', airport.code));
      haptic('success');
    } catch (err) {
      if (err.status === 401) return sessionExpired();
      formError('airportError', err.message || t('adm.saveError'), err.status === 409 ? '#apCode' : null);
    } finally {
      setBusy(btn, false, label);
    }
  }

  /* =====================================================================
     12.5. ПОСАДОЧНЫЙ ТАЛОН, КВИТАНЦИЯ И ОТМЕНА БРОНИРОВАНИЯ
     ===================================================================== */
  const DOWNLOAD_ICON = (c) => svg('<path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/>', c, 1.9);
  const CANCEL_ICON = (c) => svg('<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>', c);

  /**
   * Штрихкод Code 128 (набор B) — настоящий, читается сканером.
   * Каждый символ — 3 полосы и 3 пробела суммарной ширины 11 модулей (стоп-символ — 13).
   */
  const CODE128 = ('212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 ' +
    '123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 ' +
    '131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 ' +
    '213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 ' +
    '112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 ' +
    '421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112').split(' ');

  function code128(text) {
    const values = [104, ...[...text].map((c) => c.charCodeAt(0)).filter((c) => c >= 32 && c < 127).map((c) => c - 32)];
    const checksum = values.reduce((sum, v, i) => sum + v * (i || 1), 0) % 103;   // старт-символ и 1-й символ — вес 1
    let x = 10, bars = '';                                                         // 10 модулей «тихой зоны» слева
    [...values, checksum, 106].forEach((code) => {
      [...CODE128[code]].forEach((w, j) => {
        if (j % 2 === 0) bars += `M${x} 0h${w}v1h-${w}z`;                          // чётные элементы — полосы
        x += Number(w);
      });
    });
    return `<svg viewBox="0 0 ${x + 10} 1" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges" role="img" aria-label="${text}"><path d="${bars}" fill="#1D1D1F"/></svg>`;
  }

  /** Затемнить цвет бренда для градиента талона */
  function shade(hex, amount) {
    const n = parseInt(hex.slice(1), 16), k = 1 - amount;
    return `rgb(${Math.round((n >> 16) * k)}, ${Math.round(((n >> 8) & 255) * k)}, ${Math.round((n & 255) * k)})`;
  }

  /** Всё, что нужно и талону, и квитанции */
  function passData(tk) {
    const f = tk.flight, al = airlineOf(f);
    const [from, to] = ticketCodes(tk);
    const rnd = seeded('gate' + tk.pnr);   // выход на посадку — стабильный для каждого билета
    return {
      f, al, from, to,
      date: ticketDate(tk),
      dep: f ? hm(f.out.dep) : '—',
      arr: f ? hm(f.out.arr) + (f.out.dayShift ? ` +${f.out.dayShift}` : '') : '—',
      boarding: f ? hm(f.out.dep - 40) : '—',                 // посадка за 40 минут до вылета
      gate: f ? 'ABCDEF'[Math.floor(rnd() * 6)] + (1 + Math.floor(rnd() * 38)) : '—',
      cabin: f ? t('cabin.' + f.cabin) : '—',
      flightNo: f ? f.no : '—',
      seats: tk.seats.length ? tk.seats.join(', ') : t('pass.seatAtCheckin'),
      // В штрихкод — только латиница и цифры: PNR + маршрут
      barcode: `${tk.pnr}${from}${to}`.replace(/[^A-Z0-9]/gi, '').toUpperCase(),
    };
  }

          ${canCancel(tk) ? `<button class="h-12 w-full rounded-2xl text-[15px] font-medium text-rose-500 transition hover:bg-rose-50 dark:hover:bg-rose-400/10" data-cancel="${escapeHtml(tk.pnr)}">${t('cancel.btn')}</button>` : ''}

        </div>

  }

  /* ---------- Квитанция: печать / «Сохранить как PDF» (или файл .html в Telegram) ---------- */
  function receiptHtml(tk) {
    const p = passData(tk);
    // SQLite хранит время в UTC без пояса — добавляем «Z», чтобы показать местное время
    const issued = tk.createdAt ? new Date(/[Z+]/.test(tk.createdAt) ? tk.createdAt : tk.createdAt.replace(' ', 'T') + 'Z') : new Date();
    const fmt = (d) => new Intl.DateTimeFormat(locale(), { dateStyle: 'long', timeStyle: 'short' }).format(d);
    const row = (label, value) => `
      <tr>
        <td style="padding:9px 0;color:#6B7280;width:42%;border-bottom:1px solid #EEF0F3">${label}</td>
        <td style="padding:9px 0;font-weight:500;border-bottom:1px solid #EEF0F3">${value}</td>
      </tr>`;
    const side = (code, time, align) => `
      <div style="text-align:${align}">
        <div style="font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1">${code}</div>
        <div style="color:#6B7280;margin-top:4px">${cityLabel(code)}${time !== '—' ? ' · ' + time : ''}</div>
      </div>`;
    return `
      <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;color:#1D1D1F;max-width:680px;margin:0 auto;font-size:13px;line-height:1.45">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px">
          <div>
            <div style="font-size:24px;font-weight:600;letter-spacing:-.02em">Aero<span style="font-weight:300;color:#9CA3AF"> // Apple Style</span></div>
            <div style="color:#6B7280;margin-top:2px">${t('rc.subtitle')}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:16px;font-weight:600">${t('rc.title')}</div>
            <div style="color:#6B7280">№ ${tk.orderId ?? escapeHtml(tk.pnr)} · ${fmt(issued)}</div>
          </div>
        </div>

        <div style="margin:22px 0;padding:20px 22px;border-radius:16px;background:#F2F8FF;display:flex;align-items:center;justify-content:space-between;gap:16px">
          ${side(p.from, p.dep, 'left')}
          <div style="flex:1;height:1px;background:#CBE3FF;position:relative"><span style="position:absolute;left:50%;top:-11px;transform:translateX(-50%);color:#4596F7;font-size:18px">✈</span></div>
          ${side(p.to, p.arr, 'right')}
        </div>

        <table style="width:100%;border-collapse:collapse">
          ${row(t('pass.passenger'), escapeHtml(tk.name))}
          ${row('PNR', `<span style="letter-spacing:.15em">${escapeHtml(tk.pnr)}</span>`)}
          ${row(t('tk.flight'), `${p.flightNo}${p.al ? ' · ' + p.al.name : ''}`)}
          ${row(t('tk.date'), p.date ? fmtDate(p.date, { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' }) : '—')}
          ${row(t('pass.class'), p.cabin)}
          ${row(t('tk.seats'), p.seats)}
          ${row(t('tk.pax'), tk.pax)}
          ${row(t('pay.paidWith'), PAY_METHODS.includes(tk.method) ? t('pay.method.' + tk.method) : '—')}
          ${row(t('rc.status'), statusLabel(tk.status || 'Оплачено'))}
        </table>

        <div style="margin-top:18px;padding:16px 0;display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #1D1D1F">
          <span style="font-size:15px;font-weight:600">${t(tk.status === 'Отменён' ? 'rc.totalCanceled' : 'rc.total')}</span>
          <span style="font-size:24px;font-weight:600;letter-spacing:-.01em">${money(tk.total)}</span>
        </div>

        <div style="margin-top:20px;text-align:center">
          <div style="height:64px;max-width:340px;margin:0 auto">${code128(p.barcode)}</div>
          <div style="font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.35em;color:#6B7280;margin-top:6px">${p.barcode}</div>
        </div>
        <p style="margin-top:26px;color:#9CA3AF;font-size:11px;text-align:center">${t('rc.footer')}</p>
      </div>`;
  }

  function downloadReceipt(pnr) {
    const tk = findTicket(pnr);
    if (!tk) return;
    const html = receiptHtml(tk);
    // WebView Telegram не умеет печатать — отдаём квитанцию файлом
    if (IS_TMA || typeof window.print !== 'function') {
      const doc = `<!doctype html><html lang="${state.lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${t('rc.title')} ${escapeHtml(tk.pnr)}</title></head><body style="margin:24px">${html}</body></html>`;
      const url = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: `Aero-${tk.pnr}.html` });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast(t('rc.downloaded'));
      return;
    }
    // В браузере — окно печати: там можно выбрать «Сохранить как PDF»
    $('#printArea').innerHTML = html;
    toast(t('rc.printHint'));
    haptic('light');
    setTimeout(() => window.print(), 400);
  }

  /** Перетаскивание шторки вниз за «ручку» */
  function initSheetDrag() {
    const grab = $('#sheetGrab'), sheet = $('#sheet');
    let startY = null, dy = 0;
    grab.addEventListener('pointerdown', (e) => { startY = e.clientY; dy = 0; sheet.classList.add('dragging'); grab.setPointerCapture(e.pointerId); });
    grab.addEventListener('pointermove', (e) => {
      if (startY === null) return;
      dy = Math.max(0, e.clientY - startY);
      sheet.style.transform = `translateY(${dy}px)`;
    });
    const end = () => {
      if (startY === null) return;
      startY = null;
      sheet.classList.remove('dragging');
      if (dy > 120) closeSheet(); else sheet.style.transform = '';
    };
    grab.addEventListener('pointerup', end);
    grab.addEventListener('pointercancel', end);
  }

  /* =====================================================================
     13. НИЖНЯЯ НАВИГАЦИЯ И ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК

  const TABS = [
