  function renderTabbar() {
    const favCount = Object.keys(state.favorites).length;
    $('#tabbar').innerHTML = TABS.map((tab) => `
      <button class="tab-btn group relative flex flex-1 flex-col items-center gap-0.5 rounded-[20px] py-2 transition-colors duration-300
        ${state.tab === tab.id ? 'active text-aero-500 dark:text-aero-300' : 'text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300'}" data-go="${tab.id}">
        <span class="tab-icon relative transition-transform duration-300 ease-apple">
          ${tab.icon('h-[24px] w-[24px]')}
          ${tab.id === 'favorites' && favCount ? `<span class="absolute -right-2 -top-1 grid h-4 min-w-4 place-items-center rounded-full bg-rose-500 px-1 text-[10px] font-semibold text-white">${favCount}</span>` : ''}
        </span>
        <span class="text-[10.5px] font-medium">${t(tab.label)}</span>
        <span class="tab-indicator absolute -bottom-0.5 h-[3px] w-5 rounded-full bg-aero-400"></span>
      </button>`).join('');
  }

  // Все экраны: вкладки нижней панели + скрытая админ-панель
  const VIEWS = [...TABS.map((x) => x.id), 'admin'];

  function go(tab) {
    if (tab === 'admin' && !state.user?.is_admin) tab = 'profile';   // админку видят только администраторы
    if (!VIEWS.includes(tab)) return;
    state.tab = tab;
    VIEWS.forEach((id) => { $('#view-' + id).hidden = id !== tab; });
    // Небо с самолётом — только на главном экране; плавно гаснет на остальных
    $('#heroSky').classList.toggle('is-off', tab !== 'search');
    if (tab === 'favorites') renderFavorites();
    if (tab === 'tickets') { renderTickets(); loadTickets(); }
    if (tab === 'profile') { renderProfile(); loadTickets(); }
    if (tab === 'admin') { renderAdmin(); loadAdmin(); }
    // Адрес /admin — у админ-панели, у остальных экранов — главная
    if (API_AVAILABLE) {
      const path = tab === 'admin' ? '/admin' : '/';
      if (location.pathname !== path || location.search) history.replaceState(null, '', path);
    }
    renderTabbar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    haptic('select');
  }

  /* =====================================================================
     14. ТЕМА: СВЕТЛАЯ / ТЁМНАЯ
     ===================================================================== */
  /** Синхронизировать цвет системной панели браузера и шапки Telegram */
  function syncChrome() {
    const bg = THEME_BG[state.theme];
    $('#themeColorMeta').setAttribute('content', bg);
    $('#themeBtn').setAttribute('aria-label', t(state.theme === 'dark' ? 'theme.toLight' : 'theme.toDark'));
    if (IS_TMA) { try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {} }
  }

  /**
   * Переключение темы.
   * - Есть View Transitions API (Chrome, Edge, Safari 18+) → новая тема «раскрывается» кругом от кнопки.
   * - Нет API (WebView Telegram, старые браузеры) → все цвета плавно перетекают за 0.6 с.
   */
  function setTheme(theme, origin, { remember = true } = {}) {
    if (theme === state.theme) return;
    const root = document.documentElement;
    const apply = () => {
      state.theme = theme;
      root.classList.toggle('dark', theme === 'dark');
      repaintLogos();
      if (state.tab === 'profile') renderProfile();
      syncChrome();
    };
    if (remember) { state.themeChosen = true; }

    if (document.startViewTransition && !reducedMotion()) {
      const x = origin ? origin.x : window.innerWidth - 120;
      const y = origin ? origin.y : 28;
      const radius = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
      const vt = document.startViewTransition(apply);
      vt.ready.then(() => {
        root.animate(
          { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
          { duration: 700, easing: 'cubic-bezier(.32,.72,0,1)', pseudoElement: '::view-transition-new(root)' }
        );
      }).catch(() => {});
    } else {
      root.classList.add('theme-anim');
      apply();
      setTimeout(() => root.classList.remove('theme-anim'), 650);
    }
    savePrefs();
    haptic('light');
  }

  /** Центр элемента — точка, из которой «раскрывается» новая тема */
  const centerOf = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };

  /** Следовать за системной темой (или темой Telegram), пока пользователь не выбрал свою */
  function watchSystemTheme() {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const follow = (theme) => { if (!state.themeChosen) setTheme(theme, null, { remember: false }); };
    if (IS_TMA) tg.onEvent('themeChanged', () => follow(tg.colorScheme));
    else mq.addEventListener('change', (e) => follow(e.matches ? 'dark' : 'light'));
  }

  /* =====================================================================
     15. НЕБО: звёзды и лёгкий параллакс
     ===================================================================== */
  function initSky() {
    // Звёзды (видны только в тёмной теме) — детерминированно, чтобы не «прыгали» между загрузками
    const rnd = seeded('stars');
    let html = '';
    for (let i = 0; i < 70; i++) {
      const x = Math.round(rnd() * 1440), y = Math.round(rnd() * 520), r = (0.5 + rnd() * 1.1).toFixed(2);
      html += `<circle class="star" cx="${x}" cy="${y}" r="${r}" style="animation-delay:${(rnd() * 4).toFixed(2)}s;opacity:${(0.4 + rnd() * 0.6).toFixed(2)}"/>`;
    }
    $('#stars').innerHTML = html;

    // Параллакс: слои неба уходят вверх медленнее, чем контент, — ощущение глубины
    if (reducedMotion()) return;
    const layers = $$('#heroSky .sky-layer');
    const speeds = [0.15, 0.22, 0.3, 0.38];
    let ticking = false;
    window.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y = Math.min(window.scrollY, 900);
        layers.forEach((l, i) => { l.style.transform = `translate3d(0, ${y * speeds[i]}px, 0)`; });
        ticking = false;
      });
    }, { passive: true });
  }

  /* =====================================================================
     16. ЯЗЫК И ВАЛЮТА — полная перерисовка интерфейса
     ===================================================================== */
  function applyI18n() {
    document.documentElement.lang = state.lang;
    $$('[data-i18n]').forEach((el) => (el.textContent = t(el.dataset.i18n)));
    $$('[data-i18n-ph]').forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));
    $$('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    document.title = t('meta.title');
    $$('#langSeg [data-lang]').forEach((b) => {
      const on = b.dataset.lang === state.lang;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
  }

  function renderAll() {
    applyI18n();
    syncChrome();
    $$('#currencySeg .seg-btn').forEach((b) => b.classList.toggle('active', b.dataset.cur === state.currency));
    $('#currencyCycle').textContent = { RUB: '₽', USD: '$', EUR: '€' }[state.currency];
    renderSearchPanel();
    if (state.query) renderResults();
    if (state.tab === 'favorites') renderFavorites();
    if (state.tab === 'tickets') renderTickets();
    renderProfile();
    renderAccount();
    renderTabbar();
    if (state.tab === 'admin') renderAdmin();
    if (state.sheet) renderSheet();
    if (state.support.open && !state.support.sending) renderSupport();
    if (state.modal && !state.modal.busy) {
      if (state.modal.type === 'auth') captureAuthFields();   // не терять введённое при смене языка
      renderModal();
    }
  }

  /** Смена языка без перезагрузки: перерисовка из словаря + мягкое «проявление» текста */
  function setLang(lang) {
    if (lang === state.lang || !I18N[lang]) return;
    state.lang = lang;
    savePrefs();
    renderAll();
    document.body.classList.remove('lang-fade'); void document.body.offsetWidth; document.body.classList.add('lang-fade');
    haptic('select');
  }
  function setCurrency(cur) { state.currency = cur; savePrefs(); renderAll(); haptic('select'); }

  /* =====================================================================
     17. ВСПЛЫВАЮЩИЕ ПАНЕЛИ
     ===================================================================== */
  function closePopovers(except) {
    $$('.popover.open').forEach((p) => p !== except && p.classList.remove('open'));
  }
  function togglePopover(id) {
    const pop = $('#' + id);
    const willOpen = !pop.classList.contains('open');
    closePopovers(pop);
    pop.classList.toggle('open', willOpen);
    if (willOpen && pop.dataset.side) {
      const input = $('.pop-search', pop);
      input.value = '';
      renderCityList(pop);
      setTimeout(() => input.focus({ preventScroll: true }), 60);
    }
  }

  /** Открыть нативный календарь (showPicker поддерживается в современных браузерах) */
  function openDatePicker(input) {
    try { input.showPicker(); } catch (e) { input.focus(); input.click(); }
  }

  /* =====================================================================
     18. ОБРАБОТЧИКИ СОБЫТИЙ (делегирование)
     ===================================================================== */
  function bindEvents() {
    // Глобальные клики: навигация, избранное, карточки, места, действия профиля
    document.addEventListener('click', (e) => {
      const el = e.target;

      const goBtn = el.closest('[data-go]');
      if (goBtn) {
        e.preventDefault();
        if (goBtn.hasAttribute('data-close-sheet')) closeSheet();
        go(goBtn.dataset.go);
        if (goBtn.dataset.go === 'tickets') {
          const first = $('#ticketList article');
          first && first.classList.add('ring-2', 'ring-aero-300');
        }
        return;
      }

      const favBtn = el.closest('[data-fav]');
      if (favBtn) {
        e.stopPropagation();
        const id = favBtn.dataset.fav;
        if (state.favorites[id]) { delete state.favorites[id]; toast(t('toast.unfav')); }
        else { state.favorites[id] = findFlight(id); toast(t('toast.fav')); }
        store.set('fav', state.favorites);
        $$(`[data-fav="${id}"]`).forEach((b) => { b.classList.toggle('is-fav', !!state.favorites[id]); b.classList.remove('heart-pop'); void b.offsetWidth; b.classList.add('heart-pop'); });
        if (state.tab === 'favorites') renderFavorites();
        renderTabbar();
        haptic('light');
        return;
      }

      const card = el.closest('[data-flight]');
      if (card) { openSheet(card.dataset.flight); return; }

      const seat = el.closest('[data-seat]');
      if (seat && state.sheet) {
        const s = state.sheet, id = seat.dataset.seat;
        if (s.seats.includes(id)) s.seats = s.seats.filter((x) => x !== id);
        else { s.seats.push(id); if (s.seats.length > s.pax) s.seats.shift(); }
        renderSeats(); renderSummary(); haptic('select');
        return;
      }

      // Аккаунт и универсальное окно
      // Билеты: отмена (кнопка внутри карточки — раньше, чем открытие талона), квитанция, талон
      const cancelBtn = el.closest('[data-cancel]');
      if (cancelBtn) {
        openModal({ type: 'cancel', pnr: cancelBtn.dataset.cancel, fromPass: state.modal?.type === 'pass', busy: false });
        return;
      }
      if (el.closest('[data-cancel-back]')) {
        const m = state.modal;
        m.fromPass ? openModal({ type: 'pass', pnr: m.pnr }) : closeModal();
        return;
      }
      if (el.closest('[data-cancel-confirm]')) { confirmCancel(); return; }
      const receiptBtn = el.closest('[data-receipt]');
      if (receiptBtn) { downloadReceipt(receiptBtn.dataset.receipt); return; }
      const passEl = el.closest('[data-pass]');
      if (passEl) { openModal({ type: 'pass', pnr: passEl.dataset.pass }); return; }

      const authBtn = el.closest('[data-auth]');
      if (authBtn) { openAuth(authBtn.dataset.auth); return; }
      const authModeBtn = el.closest('[data-auth-mode]');
      if (authModeBtn) { switchAuthMode(authModeBtn.dataset.authMode); return; }
      if (el.closest('[data-auth-show]')) {
        captureAuthFields();
        state.modal.show = !state.modal.show;
        renderAuthForm();
        $('#authPassword').focus();
        return;
      }
      if (el.closest('[data-logout]')) { logout(); return; }
      if (el.closest('[data-modal-close]')) { closeModal(); return; }

      // Поиск: ближайшая дата с рейсами
      const nearbyBtn = el.closest('[data-nearby]');
      if (nearbyBtn) {
        const day = nearbyBtn.dataset.nearby;
        if (nearbyBtn.dataset.nearbyDir === 'back') state.ret = day < state.depart ? state.depart : day;
        else {
          state.depart = day;
          if (state.ret < day) state.ret = isoAddDays(parseISO(day), 7);
        }
        renderSearchPanel();
        runSearch();
        return;
      }

      // Админ-панель
      if (el.closest('[data-admin-refresh]')) { loadAdmin(); return; }
      const sectionBtn = el.closest('[data-admin-section]');
      if (sectionBtn) { selectAdminSection(sectionBtn.dataset.adminSection); return; }
      const scopeBtn = el.closest('[data-fl-scope]');
      if (scopeBtn) {
        state.admin.flightScope = scopeBtn.dataset.flScope;
        state.admin.flightLimit = 50;
        $$('[data-fl-scope]').forEach((b) => b.classList.toggle('active', b === scopeBtn));
        renderFlightRows();
        haptic('select');
        return;
      }
      if (el.closest('[data-fl-more]')) { state.admin.flightLimit += 50; renderFlightRows(); return; }
      if (el.closest('[data-fl-baggage]')) { $('#flBaggage').classList.toggle('on'); haptic('select'); return; }
      const delFlight = el.closest('[data-del-flight]');
      if (delFlight) { askDeleteFlight(Number(delFlight.dataset.delFlight)); return; }
      const delAirport = el.closest('[data-del-airport]');
      if (delAirport) { askDeleteAirport(Number(delAirport.dataset.delAirport)); return; }
      if (el.closest('[data-ask-confirm]')) { runAsk(); return; }
      const filterBtn = el.closest('[data-admin-filter]');
      if (filterBtn) {
        state.admin.filter = filterBtn.dataset.adminFilter;
        $$('[data-admin-filter]').forEach((b) => b.classList.toggle('active', b === filterBtn));
        renderAdminRows();
        haptic('select');
        return;
      }
      const editBtn = el.closest('[data-edit]');
      if (editBtn) { openEdit(Number(editBtn.dataset.edit)); return; }
      const deleteBtn = el.closest('[data-delete]');
      if (deleteBtn) { openModal({ type: 'confirm', id: Number(deleteBtn.dataset.delete), busy: false }); return; }
      if (el.closest('[data-confirm-delete]')) { confirmDelete(); return; }
      const edStatus = el.closest('[data-edit-status]');
      if (edStatus) { selectEditStatus(edStatus.dataset.editStatus); return; }

      // Служба заботы
      if (el.closest('[data-support]')) { openSupport(); return; }
      if (el.closest('[data-support-close]')) { closeSupport(); return; }
      if (el.closest('[data-support-new]')) { state.support.view = 'form'; renderSupport(); $('#support').scrollTo({ top: 0, behavior: 'smooth' }); return; }
      const faqBtn = el.closest('[data-faq]');
      if (faqBtn) { toggleFaq(Number(faqBtn.dataset.faq)); return; }
      const topicBtn = el.closest('[data-topic]');
      if (topicBtn) { selectTopic(topicBtn.dataset.topic); return; }

      // Мастер оформления: купить → выбрать способ → оплатить
      if (el.closest('#buyBtn')) { goToPayment(); return; }
      if (el.closest('[data-pay-back]')) { backToDetails(); return; }
      const methodBtn = el.closest('[data-method]');
      if (methodBtn) { selectMethod(methodBtn.dataset.method); return; }
      if (el.closest('[data-pay]')) { processPayment(); return; }
      const copyBtn = el.closest('[data-copy]');
      if (copyBtn) { copyText(copyBtn.dataset.copy); return; }
      if (el.closest('[data-usdt-renew]') && state.sheet) { state.sheet.usdt = null; renderMethodPanel(); haptic('light'); return; }

      const action = el.closest('[data-action]');
      if (action) {
        const a = action.dataset.action;
        if (a === 'cycle-currency') { const list = Object.keys(RATES); setCurrency(list[(list.indexOf(state.currency) + 1) % list.length]); }
        if (a === 'toggle-lang') setLang(state.lang === 'ru' ? 'en' : 'ru');
        if (a === 'toggle-theme') setTheme(state.theme === 'dark' ? 'light' : 'dark', centerOf($('.switch', action)));
        if (a === 'toggle-notify') { state.notifications = !state.notifications; savePrefs(); renderProfile(); haptic('select'); }
        if (a === 'reset') {
          // Локальные данные: избранное и офлайн-билеты. Заказы аккаунта хранятся на сервере и не удаляются
          state.favorites = {};
          store.set('fav', {});
          store.set('tickets', []);
          if (!API_AVAILABLE) state.tickets = [];
          renderAll();
          toast(t('toast.reset'));
        }
        return;
      }

      // Клик вне поля закрывает выпадающие панели
      if (!el.closest('.field')) closePopovers();
    });

    // Имя пассажира живёт в состоянии шторки — переживает смену языка/темы
    document.addEventListener('input', (e) => {
      // Форма поддержки: черновик + счётчик символов
      // Вход / регистрация: снимаем подсветку ошибки, обновляем индикатор пароля
      if (state.modal?.type === 'auth' && e.target.id?.startsWith('auth')) {
        e.target.classList.remove('invalid');
        if (e.target.id === 'authPassword') { state.modal.password = e.target.value; updateStrength(); }
        return;
      }
      if (e.target.id === 'adminSearch') { state.admin.query = e.target.value; renderAdminRows(); return; }
      if (e.target.id === 'flightSearch') { state.admin.flightQuery = e.target.value; state.admin.flightLimit = 50; renderFlightRows(); return; }
      if (e.target.id === 'airportSearch') { state.admin.airportQuery = e.target.value; renderAirportList(); return; }
      if (e.target.closest?.('#flightForm, #airportForm')) {
        e.target.classList.remove('invalid');
        if (e.target.id === 'apCode') e.target.value = e.target.value.replace(/[^a-z]/gi, '').toUpperCase();
        return;
      }
      if (state.modal?.type === 'edit' && e.target.id?.startsWith('ed')) { e.target.classList.remove('invalid'); return; }

      const sup = { supName: 'name', supContact: 'contact', supMessage: 'message', supPnr: 'pnr' }[e.target.id];
      if (sup) {
        state.support[sup] = e.target.value;
        e.target.classList.remove('invalid');
        if (sup === 'message') $('#supCount').textContent = `${e.target.value.length}/1000`;
        return;
      }
      if (!state.sheet) return;
      if (e.target.id === 'passengerName') { state.sheet.name = e.target.value; e.target.classList.remove('invalid'); }
      if (['ccNumber', 'ccExp', 'ccCvv'].includes(e.target.id)) onCardInput(e.target);
    });

    // Клавиатура: Enter открывает карточку, Esc закрывает шторку и панели
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closePopovers(); closeTopLayer(); }   // сначала закрываем верхнее окно
      if (e.key === 'Enter' && e.target.matches('[data-flight]')) openSheet(e.target.dataset.flight);
      if (e.key === 'Enter' && e.target.matches('article[data-pass]')) openModal({ type: 'pass', pnr: e.target.dataset.pass });
      if (e.key === 'Enter' && e.target.id === 'passengerName') goToPayment();
      if (e.key === 'Enter' && e.target.id === 'ccCvv') processPayment();
    });

    // Шапка: валюта, тема, язык
    $('#currencySeg').addEventListener('click', (e) => { const b = e.target.closest('[data-cur]'); b && setCurrency(b.dataset.cur); });
    $('#themeBtn').addEventListener('click', (e) => setTheme(state.theme === 'dark' ? 'light' : 'dark', centerOf(e.currentTarget)));
    $('#langSeg').addEventListener('click', (e) => { const b = e.target.closest('[data-lang]'); b && setLang(b.dataset.lang); });

    // Тип поездки
    $('#tripSeg').addEventListener('click', (e) => {
      const b = e.target.closest('[data-trip]');
      if (!b) return;
      state.trip = b.dataset.trip; renderSearchPanel(); haptic('select');
    });

    // Открытие панелей полей
    $$('[data-pop]').forEach((b) => b.addEventListener('click', () => togglePopover(b.dataset.pop)));

    // Поиск по городам и выбор города
    $$('.popover[data-side]').forEach((pop) => {
      $('.pop-search', pop).addEventListener('input', (e) => renderCityList(pop, e.target.value));
      pop.addEventListener('click', (e) => {
        const b = e.target.closest('[data-city]');
        if (!b) return;
        const side = b.dataset.side, other = side === 'from' ? 'to' : 'from';
        if (state[other] === b.dataset.city) state[other] = state[side]; // тот же город — меняем местами
        state[side] = b.dataset.city;
        pop.classList.remove('open');
        renderSearchPanel(); haptic('select');
      });
    });

    // Обмен «Откуда» ⇄ «Куда»
    $('#swapBtn').addEventListener('click', () => {
      [state.from, state.to] = [state.to, state.from];
      renderSearchPanel(); haptic('light');
    });

    // Даты
    $('#departLabel').addEventListener('click', (e) => { e.preventDefault(); closePopovers(); openDatePicker($('#departInput')); });
    $('#returnLabel').addEventListener('click', (e) => {
      e.preventDefault(); closePopovers();
      if (state.trip !== 'round') { state.trip = 'round'; renderSearchPanel(); }
      openDatePicker($('#returnInput'));
    });
    $('#departInput').addEventListener('change', (e) => {
      if (!e.target.value) return;
      state.depart = e.target.value;
      if (state.ret < state.depart) state.ret = isoAddDays(parseISO(state.depart), 7);
      renderSearchPanel();
    });
    $('#returnInput').addEventListener('change', (e) => {
      if (!e.target.value) return;
      state.ret = e.target.value < state.depart ? state.depart : e.target.value;
      renderSearchPanel();
    });

    // Пассажиры и класс
    $('#paxPop').addEventListener('click', (e) => {
      const step = e.target.closest('[data-step]');
      if (step) {
        const [key, delta] = step.dataset.step.split(':');
        state.pax[key] = Math.max(key === 'adults' ? 1 : 0, state.pax[key] + Number(delta));
        renderSearchPanel(); haptic('select');
      }
      const cabin = e.target.closest('[data-cabin]');
      if (cabin) { state.cabin = cabin.dataset.cabin; renderSearchPanel(); haptic('select'); }
    });

    // Быстрые направления
    $('#popular').addEventListener('click', (e) => {
      const b = e.target.closest('[data-quick]');
      if (!b) return;
      state.to = b.dataset.quick; renderSearchPanel(); runSearch();
    });

    // Сортировка и фильтр
    $('#sortBar').addEventListener('click', (e) => {
      const s = e.target.closest('[data-sort]');
      if (s) state.sort = s.dataset.sort;
      if (e.target.closest('[data-direct]')) state.directOnly = !state.directOnly;
      if (s || e.target.closest('[data-direct]')) { renderResults(); haptic('select'); }
    });

    // Отправка формы
    $('#searchForm').addEventListener('submit', (e) => { e.preventDefault(); closePopovers(); runSearch(); });

    // Шторка
    $('#backdrop').addEventListener('click', closeSheet);

    // Окно поддержки
    $('#supportBackdrop').addEventListener('click', closeSupport);
    $('#modalBackdrop').addEventListener('click', closeModal);

    // Формы, которые рисуются динамически
    document.addEventListener('submit', (e) => {
      if (e.target.id === 'supportForm') submitSupport(e);
      if (e.target.id === 'authForm') submitAuth(e);
      if (e.target.id === 'editForm') submitEdit(e);
      if (e.target.id === 'flightForm') submitFlight(e);
      if (e.target.id === 'airportForm') submitAirport(e);
    });
    // Смена статуса прямо в таблице админки
    document.addEventListener('change', (e) => {
      if (e.target.matches('[data-status]')) changeStatus(Number(e.target.dataset.status), e.target.value, e.target);
    });
    if (IS_TMA) tg.BackButton.onClick(closeTopLayer);
    $('#sheetClose').addEventListener('click', closeSheet);
    initSheetDrag();
  }

  /* =====================================================================
     19. СТАРТ
     ===================================================================== */
  initSky();
  bindEvents();
  watchSystemTheme();
  renderAll();
  loadAirports();   // города для «Откуда / Куда» — из таблицы airports
  initAuth();       // узнаём, вошёл ли пользователь, и открываем /admin, если нужно
  </script>
</body>
</html>
